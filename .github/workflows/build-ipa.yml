name: Build unsigned IPA
on:
  workflow_dispatch:
  push:
    branches: [ main ]
jobs:
  build:
    runs-on: macos-15-intel
    steps:
      - uses: actions/checkout@v4

      - name: Show Xcode version
        run: |
          xcodebuild -version
          xcode-select -p

      - name: Select Xcode
        run: |
          sudo xcode-select -s /Applications/Xcode.app/Contents/Developer || sudo xcode-select -s "$(xcode-select -p)"
          xcodebuild -version

      - name: Unzip project
        run: |
          unzip -o jodel-rebuild.zip
          ls -la Saha

      - name: Validate project
        run: |
          cd Saha
          plutil -lint Saha.xcodeproj/project.pbxproj
          plutil -lint Resources/Info.plist
          xcodebuild -list -project Saha.xcodeproj

      - name: Build app (no signing)
        # No shared scheme in this project, so build by target (not -scheme).
        # -derivedDataPath requires -scheme, so it is omitted; the .app lands
        # in ~/Library/Developer/Xcode/DerivedData and the package step finds it.
        run: |
          cd Saha
          xcodebuild -project Saha.xcodeproj -target Saha -configuration Release -sdk iphoneos CODE_SIGNING_ALLOWED=NO CODE_SIGN_IDENTITY="" CODE_SIGNING_REQUIRED=NO

      - name: Package IPA
        run: |
          cd Saha
          APP=$(find build/Release-iphoneos -maxdepth 1 -name "*.app" 2>/dev/null | head -n 1)
          if [ -z "$APP" ]; then APP=$(find DerivedData/Build/Products/Release-iphoneos -maxdepth 1 -name "*.app" 2>/dev/null | head -n 1); fi
          if [ -z "$APP" ]; then APP=$(find ~/Library/Developer/Xcode/DerivedData -name "Saha.app" -path "*Release-iphoneos*" 2>/dev/null | head -n 1); fi
          test -n "$APP" || { echo "ERROR: no .app found"; find ~/Library/Developer/Xcode/DerivedData -maxdepth 3 -type d -name "*Saha*" | head -20; exit 1; }
          echo "APP=$APP"
          mkdir -p Payload
          cp -r "$APP" Payload/
          zip -r ../Saha-unsigned.ipa Payload
          ls -lh ../Saha-unsigned.ipa

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: Saha-unsigned-ipa
          path: Saha-unsigned.ipa
